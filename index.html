<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TTD PROJECT: GLOBAL VOICE</title>
    <style>
        body { 
            background: #050505; color: #00ff41; 
            font-family: 'Courier New', monospace; 
            margin: 0; display: flex; flex-direction: column; height: 100vh; 
            overflow: hidden;
        }
        .panel { 
            background: rgba(0, 255, 65, 0.1); 
            padding: 10px; border-bottom: 2px solid #00ff41;
            text-align: center; box-shadow: 0 0 15px #00ff41;
            z-index: 10;
        }
        .main-frame { flex-grow: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; }
        
        /* Настройки окна трансляции */
        iframe {
            width: 100%; height: 100%;
            border: none;
            display: none; /* Скрыто до авторизации */
        }

        .btn-group { display: flex; gap: 20px; z-index: 20; }
        button { 
            background: black; color: #00ff41; border: 2px solid #00ff41; 
            padding: 20px; cursor: pointer; font-family: inherit; font-weight: bold;
            box-shadow: 0 0 10px #00ff41; font-size: 1.2rem;
        }
        button:hover { background: #00ff41; color: black; }

        .info { font-size: 14px; margin-top: 5px; color: #ff00ff; }
        h1 { margin: 5px 0; letter-spacing: 5px; font-size: 1.5rem; }
        .footer { border-top: 2px solid #00ff41; padding: 10px; text-align: center; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>[ TTD GLOBAL SPEAKER V1 ]</h1>
        <div id="status" class="info">ОЖИДАНИЕ АВТОРИЗАЦИИ...</div>
    </div>

    <div class="main-frame" id="content">
        <div class="btn-group" id="auth-buttons">
            <button onclick="loginAdmin()">ВХОД: АДМИН</button>
            <button onclick="loginUser()">ВХОД: ПОЛЬЗОВАТЕЛЬ</button>
        </div>
        
        <iframe id="telemost-frame" allow="camera; microphone; fullscreen; display-capture; autoplay"></iframe>
    </div>

    <div class="footer">
        <p>© 2026 THINK-TRY-DO COMPANY // BY TIMOFEY</p>
    </div>

    <script>
        // Твоя прямая ссылка. Добавил параметры, чтобы не было кнопок "Start Building"
        const ROOM_NAME = "VagueExcessesRemoveTherefore"; 
        const JITSI_LINK = https://meet.jit.si/${ROOM_NAME}#config.prejoinPageEnabled=false&config.startWithAudioMuted=false&config.backgroundAlpha=0;

        function loginAdmin() {
            let pass = prompt("ВВЕДИТЕ ПАРОЛЬ АДМИНИСТРАТОРА:");
            if (pass === "123123") {
                alert("ДОСТУП РАЗРЕШЕН. СИСТЕМА АКТИВИРОВАНА.");
                startProject("АДМИНИСТРАТОР");
            } else {
                alert("ОШИБКА: НЕВЕРНЫЙ ПАРОЛЬ!");
            }
        }

        function loginUser() {
            startProject("ПОЛЬЗОВАТЕЛЬ");
        }

        function startProject(role) {
            document.getElementById('auth-buttons').style.display = 'none';
            document.getElementById('status').innerText = "РЕЖИМ: " + role + " // КАНАЛ ОТКРЫТ";
            
            const frame = document.getElementById('telemost-frame');
            frame.src = JITSI_LINK;
            frame.style.display = 'block';
        }
    </script>

</body>
</html>
